name: Validate portfolio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/portfolio.test.mjs
      - name: Install headless-browser test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright
      - name: Validate mobile screenshot layout at iPhone width
        run: node tests/mobile-gallery.test.mjs
