name: Complete verified creature episode release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-creatures-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: finish-creatures-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve fully rendered and validated Brother Rubicon audio
        uses: actions/download-artifact@v4
        with:
          name: thdies-creatures-episode
          run-id: 40073108602
          github-token: ${{ github.token }}
          path: thdies-cast
      - name: Rebuild feed and listening page without resynthesizing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12' 'Pillow>=10.4'
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'thdies-cast/production')
          import render_creatures as m
          record=json.loads(m.MANIFEST.read_text(encoding='utf-8'))
          assert record['enclosure_bytes']==m.MP3.stat().st_size
          m.update_feed(record)
          m.update_landing(record)
          m.verify_file()
          PY
          test "$(find thdies-cast/audio -maxdepth 1 -name '*.mp3' | wc -l)" -eq 14
          git status --short
      - name: Commit and publish episode fourteen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thdies-cast/audio/14-creatures-behaving-strangely.mp3 thdies-cast/creatures-manifest.json thdies-cast/creatures-behaving-strangely.md thdies-cast/feed.xml thdies-cast/index.html
          if git diff --cached --quiet; then
            echo 'Already published'
            exit 0
          fi
          git commit -m 'Publish verified Creatures Behaving Strangely audio as episode 14'
          git stash push --include-untracked -m 'Clear unreleased runtime files before rebase' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Confirm public repository includes MP3
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git ls-tree -r --name-only origin/main | grep -Fx 'thdies-cast/audio/14-creatures-behaving-strangely.mp3'
          echo 'Published Episode 14 to main; GitHub Pages deployment follows.'
