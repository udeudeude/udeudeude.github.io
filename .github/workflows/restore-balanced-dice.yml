name: Restore verified balanced dice publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-balanced-dice.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the eight already-rendered and verified MP3s
        uses: actions/download-artifact@v4
        with:
          name: Completed-balanced-dice-MP3s
          run-id: 40054311173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/rescued-balanced-dice/audio
      - name: Retrieve the matching validated RSS and show-note manifest
        uses: actions/download-artifact@v4
        with:
          name: expanded-rubicon-dice-season
          run-id: 40054311173
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/rescued-balanced-dice/meta
      - name: Restore publication files at their canonical paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          raw=Path('/tmp/rescued-balanced-dice')
          site=Path('thdies-cast')
          songs=list((raw/'audio').rglob('*.mp3'))
          assert len(songs)==8,[str(x) for x in songs]
          for song in songs:
              assert song.name.startswith(tuple(f'{n:02d}-' for n in range(6,14)))
              dest=site/'audio'/song.name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(song,dest)
              assert dest.stat().st_size>1_000_000
              print('Restored',dest,dest.stat().st_size,flush=True)
          metadata=raw/'meta'
          manifests=list(metadata.rglob('manifest.json'))
          feeds=list(metadata.rglob('feed.xml'))
          notes=list(metadata.rglob('show-notes/*.md'))
          assert len(manifests)==1 and len(feeds)==1 and len(notes)==8
          target=site/'dice-methods'
          (target/'show-notes').mkdir(parents=True,exist_ok=True)
          shutil.copy2(manifests[0],target/'manifest.json')
          shutil.copy2(feeds[0],site/'feed.xml')
          for note in notes:
              shutil.copy2(note,target/'show-notes'/note.name)
          data=json.loads((target/'manifest.json').read_text())
          assert len(data['new_episodes'])==8
          print('Restored eight verified MP3s, notes, manifest, and thirteen-item RSS',flush=True)
          PY
      - name: Restore the companion episode-listening landing page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy pillow soundfile
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'thdies-cast/production')
          import render_expanded_dice as render
          data=json.loads(Path('thdies-cast/dice-methods/manifest.json').read_text())
          render.landing_page(data['new_episodes'])
          assert Path('thdies-cast/dice-methods/index.html').stat().st_size>4000
          print('Restored listening page',flush=True)
          PY
      - name: Recheck RSS and exact balanced outcomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          root=Path('thdies-cast')
          data=json.loads((root/'dice-methods/manifest.json').read_text())
          eps=data['new_episodes']
          assert len(eps)==8
          items=ET.parse(root/'feed.xml').findall('./channel/item')
          assert len(items)==13 and len({x.findtext('guid') for x in items})==13
          assert [x.findtext('guid') for x in items[8:]]==[f'urn:thdies-cast:pilot:{i:02d}:v1' for i in (5,4,3,2,1)]
          for name,e in eps.items():
              target=root/'audio'/name
              assert target.stat().st_size==e['enclosure_bytes']
              assert e['postroll_pre_coda_pause_seconds']==0
              assert "I am Brother Rubicon. The die's cast." in e['spoken_intro_text']
              assert len(e['coda_text'])==2
              matching=[x for x in items if x.find('enclosure') is not None and x.find('enclosure').get('url','').endswith('/'+name)]
              assert len(matching)==1
              assert int(matching[0].find('enclosure').get('length'))==target.stat().st_size
              assert (root/e['full_show_notes_path']).stat().st_size>600
          pairs=eps['09-2d6-balanced.mp3']['ordered_outcomes']
          assert Counter(tuple(p) for p in pairs)==Counter({(a,b):10 for a in range(1,7) for b in range(1,7)})
          assert Counter(eps['10-d100-balanced.mp3']['ordered_outcomes'])==Counter({i:3 for i in range(1,101)})
          pairs20=eps['08-d20-pair-balanced.mp3']['ordered_outcomes']
          assert len(set((pairs20[i],pairs20[(i+1)%400]) for i in range(400)))==400
          print('PASSED recovery validation: same verified eight MP3s and 13 feed items',flush=True)
          PY
      - name: Publish recovered files without rerendering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thdies-cast/audio/{06,07,08,09,10,11,12,13}-*.mp3 thdies-cast/dice-methods/ thdies-cast/feed.xml
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Brother Rubicon dice editions from retained production artifacts'
            git push origin HEAD:main
          fi
