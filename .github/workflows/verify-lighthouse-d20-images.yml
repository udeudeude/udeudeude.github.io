name: Validate Lighthouse D20 illustrations
on:
  push:
    branches: [main]
    paths:
      - 'thdies-cast/production/render_lighthouse_d20_video.py'
      - '.github/workflows/verify-lighthouse-d20-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small graphics dependencies
        run: python -m pip install pillow numpy soundfile
      - name: Generate and verify twenty distinct D20 faces
        run: |
          set -euo pipefail
          python -m py_compile thdies-cast/production/render_lighthouse_d20_video.py
          python thdies-cast/production/render_lighthouse_d20_video.py --images-only
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import sys
          sys.path.insert(0,'thdies-cast/production')
          import render_lighthouse_d20_video as v
          faces=Path('thdies-cast/dice-methods/light-house-frames')
          pics=sorted(faces.glob('*.png'))
          assert len(pics)==21
          assert len(set(hashlib.sha256(p.read_bytes()).hexdigest() for p in pics))==21
          for i in range(20):
              orientation=v.orientation(i)
              rotated=v.rotated(v.GEOM[i][1],*orientation)
              assert rotated[2]>.999, (i,rotated)
          for p in pics:
              with Image.open(p) as x:
                  assert x.size==(800,800) and x.mode=='RGB'
          print('VALIDATED 20 uniquely numbered LightHouse-derived images, all face normals pointed toward camera',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-D20-art-previews
          path: thdies-cast/dice-methods/light-house-frames/
