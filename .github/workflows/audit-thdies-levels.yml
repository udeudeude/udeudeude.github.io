name: Audit Thdie's Cast narration levels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-thdies-levels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy>=1.26,<3'
      - name: Compare spoken patter to outcomes across all episodes
        run: python -u thdies-cast/production/audit_audio_levels.py
