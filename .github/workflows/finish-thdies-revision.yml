name: Publish saved and verified fourteen-episode audio revision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-thdies-revision.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: thdies-audio-revision-20261024
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only audio verification dependencies, not voice models
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12' 'Pillow>=10.4'
      - name: Restore 14 fully rendered episodes and manifests from preserved build
        uses: actions/download-artifact@v4
        with:
          name: corrected-thdies-episodes-14
          run-id: 40076724684
          github-token: ${{ github.token }}
          path: thdies-cast
      - name: Fix last two low codas and reconstruct public publication
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile thdies-cast/production/{finish_audio_revision,remaster_library,audit_audio_levels,render_creatures}.py
          python -u thdies-cast/production/finish_audio_revision.py
          python thdies-cast/production/render_creatures.py --verify-only
          python - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as E
          root=Path('thdies-cast')
          assert len(E.parse(root/'feed.xml').findall('./channel/item'))==14
          assert json.loads((root/'creatures-manifest.json').read_text())['encounters']==80
          assert json.loads((root/'pilot-manifest.json').read_text())['episodes']['04-wilderness-oracle.mp3']['neutral_chimes']==0
          assert len(list((root/'audio').glob('*.mp3')))==14
          print("Recovered complete 14-episode artifact; two final codas corrected",flush=True)
          PY
      - name: Preserve final recovered output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-14-episode-chime-free-master
          path: |
            thdies-cast/audio/*.mp3
            thdies-cast/feed.xml
            thdies-cast/creatures-manifest.json
            thdies-cast/pilot-manifest.json
            thdies-cast/dice-methods/manifest.json
            thdies-cast/production/level-qc-report.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Publish verified audio, website and RSS without rerendering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thdies-cast/audio/*.mp3 thdies-cast/feed.xml thdies-cast/index.html thdies-cast/dice-methods/index.html thdies-cast/dice-methods/manifest.json thdies-cast/pilot-manifest.json thdies-cast/creatures-manifest.json thdies-cast/creatures-behaving-strangely.md thdies-cast/production/level-qc-report.json
          git diff --cached --quiet && { echo 'Already committed'; exit 0; }
          git commit -m 'Release chime-free eighty-scene oracles and restored Brother Rubicon volumes'
          git stash push --include-untracked -m 'Clear runtime files for publication rebase' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Verify new commit includes the 14 corrected recordings
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git ls-tree -r --name-only origin/main | grep -Fx 'thdies-cast/audio/14-creatures-behaving-strangely.mp3'
          echo 'Verified branch publication; Pages deployment runs separately.'
