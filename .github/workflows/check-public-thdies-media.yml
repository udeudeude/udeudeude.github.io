name: Verify public Thdie's Cast audio-only podcast
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-public-thdies-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public podcast RSS and its 13 MP3 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          import urllib.request as req
          import xml.etree.ElementTree as ET
          BASE="https://udeudeude.github.io/thdies-cast/"
          def read(url,byterange=None):
              headers={"User-Agent":"ThdiesCastPublicAudioCheck/2.0"}
              if byterange: headers["Range"]=byterange
              for attempt in range(7):
                  try:
                      with req.urlopen(req.Request(url,headers=headers),timeout=30) as r:
                          return r.status,r.headers.get("Content-Type",""),r.read(2048 if byterange else 100000)
                  except Exception as e:
                      print("Retry",attempt+1,url,e,flush=True)
                      time.sleep(8)
              raise RuntimeError("Cannot access "+url)
          status,_,data=read(BASE+"feed.xml")
          assert status==200
          feed=ET.fromstring(data)
          items=feed.findall("./channel/item")
          assert len(items)==13
          assert len(set(x.findtext("guid") for x in items))==13
          titles=[x.findtext("title") for x in items]
          assert not any(t[:3].strip().isdigit() for t in titles),titles
          first=next(x for x in items if x.findtext("guid")=="urn:thdies-cast:pilot:01:v1")
          itunes="{http://www.itunes.com/dtds/podcast-1.0.dtd}"
          assert first.findtext(itunes+"episodeType")=="full"
          assert "ARCHIVAL METHOD" not in first.findtext("description","")
          for x in items:
              enclosure=x.find("enclosure")
              assert enclosure is not None and enclosure.get("type")=="audio/mpeg"
              url=enclosure.get("url")
              assert url.startswith(BASE+"audio/")
              status,content,data=read(url,"bytes=0-1023")
              assert status in (200,206),(url,status)
              assert data.startswith(b"ID3") or data[:1]==b"\xff" or b"\xff\xfb" in data,("Invalid MP3",url)
              print("MP3",url.rsplit("/",1)[-1],status,content,flush=True)
          print("PUBLIC AUDIO PODCAST OK: 13 episodes and valid unnumbered titles",flush=True)
          PY
