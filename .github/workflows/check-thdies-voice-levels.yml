name: Check podcast narration volume against results
on:
  push:
    branches: [main]
    paths:
      - 'thdies-cast/audio/*.mp3'
      - 'thdies-cast/production/audit_audio_levels.py'
      - '.github/workflows/check-thdies-voice-levels.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  voice-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and numerical audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy>=1.26,<3'
      - name: Reject substantial introduction/coda imbalances
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0,'thdies-cast/production')
          import audit_audio_levels as a
          report=a.measure()
          assert len(report) in (14,15)
          failures=[]
          for row in report:
              n=row['episode']
              if n==5:
                  continue # Exact-timing music score, not dry spoken outcomes.
              if not (6<=n<=15):
                  continue
              for section in ('intro','coda'):
                  delta=abs(row[f'{section}_gap_db'])
                  if delta>4.5:
                      failures.append((n,section,delta))
          print('Brother Rubicon intro/coda level QC failures:',failures,flush=True)
          assert not failures,failures
          from pathlib import Path
          import json
          root=Path('thdies-cast')
          manifest=json.loads((root/'pilot-manifest.json').read_text())
          creatures=json.loads((root/'creatures-manifest.json').read_text())
          relics=json.loads((root/'relics-manifest.json').read_text())
          baseline=next(x for x in report if x['episode']==4)
          ref=baseline['body_db']
          assert abs(baseline['intro_db']-ref)<3.0,(baseline,ref)
          for n,meta in ((14,creatures),(15,relics)):
              row=next(x for x in report if x['episode']==n)
              assert meta['encounters']==80 and meta['neutral_chimes']==0
              assert abs(row['body_db']-ref)<2.5,(n,row['body_db'],ref)
              assert abs(row['intro_db']-ref)<4,(n,row['intro_db'],ref)
              assert abs(row['coda_db']-ref)<4,(n,row['coda_db'],ref)
          print('PASS: dice narration and all three encounter editions match the catalog speaking volume',flush=True)
          PY
