name: Final cross-episode encounter narration level mastering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-encounter-levels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thdies-final-encounter-master
  cancel-in-progress: false

jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static audio analysis and mastering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12' 'Pillow>=10.4'
      - name: Verify originals, store checksums and inspect production source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile thdies-cast/production/final_encounter_mastering.py
          test "$(find thdies-cast/audio -name '*.mp3' | wc -l)" -eq 15
          sha256sum thdies-cast/audio/*.mp3 > /tmp/original-15.sha256
          sha256sum thdies-cast/audio/05-ten-minutes-to-disaster.mp3 > /tmp/timer.sha256
      - name: Match three encounter recordings to the established speaking volume
        shell: bash
        run: |
          set -euo pipefail
          python -u thdies-cast/production/final_encounter_mastering.py
      - name: Preserve the three corrected audio masters and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-encounter-volume-matched-masters
          path: |
            thdies-cast/audio/04-wilderness-oracle.mp3
            thdies-cast/audio/14-creatures-behaving-strangely.mp3
            thdies-cast/audio/15-relics-and-curiosities.mp3
            thdies-cast/pilot-manifest.json
            thdies-cast/creatures-manifest.json
            thdies-cast/relics-manifest.json
            thdies-cast/feed.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Verify existing thirteen other tracks and all fifteen feed enclosures
        shell: bash
        run: |
          set -euo pipefail
          grep -v -E '04-wilderness-oracle.mp3|14-creatures-behaving-strangely.mp3|15-relics-and-curiosities.mp3' /tmp/original-15.sha256 | sha256sum -c -
          sha256sum -c /tmp/timer.sha256
          python - <<'PY'
          import json,xml.etree.ElementTree as E
          from pathlib import Path
          root=Path('thdies-cast')
          feed=E.parse(root/'feed.xml').findall('./channel/item')
          assert len(feed)==15 and len({x.findtext('guid') for x in feed})==15
          for e in feed:
              enc=e.find('enclosure')
              file=enc.get('url').split('/')[-1].split('?')[0]
              assert (root/'audio'/file).stat().st_size==int(enc.get('length'))
          c=json.loads((root/'creatures-manifest.json').read_text())
          r=json.loads((root/'relics-manifest.json').read_text())
          w=json.loads((root/'pilot-manifest.json').read_text())['episodes']['04-wilderness-oracle.mp3']
          assert all(m['encounters']==80 and m['neutral_chimes']==0 for m in [c,r,w])
          assert c['reference_level_db']==r['reference_level_db']
          assert abs(c['mastered_scene_level_db']-r['mastered_scene_level_db'])<2.2
          assert w['new_chime_free_intro']
          print('PASS: 15 episode enclosures, 80+80+80 encounters, no chimes, absolute speech level calibrated, all old dice preserved',flush=True)
          PY
      - name: Commit volume-calibrated audio and cache-busted public links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thdies-cast/audio/{04-wilderness-oracle,14-creatures-behaving-strangely,15-relics-and-curiosities}.mp3 thdies-cast/pilot-manifest.json thdies-cast/creatures-manifest.json thdies-cast/relics-manifest.json thdies-cast/feed.xml thdies-cast/index.html
          if git diff --cached --quiet; then
            echo 'Already mastered'
            exit 0
          fi
          git commit -m 'Equalize encounter episode voice loudness to existing published catalog'
          git stash push --include-untracked -m 'Clear temporary remaster output for safe rebase' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Verify published commit
        run: |
          set -euo pipefail
          git fetch origin main
          git ls-tree -r --name-only origin/main | grep -Fx 'thdies-cast/audio/15-relics-and-curiosities.mp3'
